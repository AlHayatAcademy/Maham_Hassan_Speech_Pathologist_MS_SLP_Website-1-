<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Maham Hassan (Speech &amp; Language Pathologist) MS SLP course-wise MCQ practice with detailed explanations and timed mock exams.">
  <meta name="theme-color" content="#0c2834">
  <title>Maham Hassan (Speech &amp; Language Pathologist)</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">SLP</div>
        <div><strong>Maham Hassan</strong><span>(Speech &amp; Language Pathologist)</span></div>
      </div>
      <nav id="primary-nav" aria-label="Primary navigation"></nav>
      <div class="sidebar-note">
        <span class="status-dot"></span>
        <div><strong>1,984 explained MCQs</strong><small>Six course banks · Lecture 2 added</small></div>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div class="search-wrap">
          <span aria-hidden="true">⌕</span>
          <input id="global-search" type="search" placeholder="Search 1,984 MCQs" autocomplete="off" aria-label="Search MCQs">
          <kbd>Ctrl K</kbd>
        </div>
        <div class="top-actions">
          <div class="streak-chip" id="streak-chip">0 day streak</div>
          <button class="avatar-button" id="profile-button" aria-label="Study settings">MH</button>
        </div>
      </header>
      <main id="app" tabindex="-1"></main>
    </div>
  </div>

  <nav class="mobile-bottom-nav" id="mobile-bottom-nav" aria-label="Mobile navigation"></nav>
  <div class="search-panel" id="search-panel" hidden aria-live="polite"></div>
  <div class="toast" id="toast" hidden></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
